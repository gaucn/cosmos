<!DOCTYPE html>
<!-- www.gaucn.com -->
<!-- cosmos.gaucn.com -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>MOTE</title>
<style>
  :root{
    --ink:#ffffff; --dim:#8b8f9a; --stroke:rgba(255,255,255,.14);
    --accent:#c9ced6; --ui-gap:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:#000;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.6) 100%)}

  .ui{position:fixed;left:0;right:0;top:0;padding:18px 16px;
    display:flex;flex-direction:column;align-items:center;gap:var(--ui-gap);pointer-events:none;z-index:5}
  .panel{pointer-events:auto;display:flex;align-items:center;gap:8px;
    background:rgba(10,10,12,.55);border:1px solid var(--stroke);border-radius:16px;padding:8px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);width:min(580px,100%)}
  .panel input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);
    font-size:16px;padding:10px 12px;letter-spacing:.02em;-webkit-user-select:text;user-select:text}
  .panel input::placeholder{color:var(--dim)}
  .panel input.drop{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
    border-radius:10px}
  .panel button{flex:none;border:0;cursor:pointer;color:#000;font-weight:700;font-size:15px;
    padding:10px 16px;border-radius:11px;letter-spacing:.04em;background:#fff;
    box-shadow:0 6px 24px rgba(255,255,255,.28);transition:transform .15s ease}
  .panel button:active{transform:scale(.96)}

  .srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  .src{pointer-events:auto;cursor:pointer;font-size:12.5px;color:var(--dim);
    border:1px solid var(--stroke);background:rgba(12,12,14,.5);border-radius:999px;padding:5px 14px;transition:.2s}
  .src.active{color:#000;background:#fff;border-color:#fff}
  .src:hover{color:var(--ink);border-color:rgba(255,255,255,.5)}
  .srcname{font-size:12px;color:var(--dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;pointer-events:none}
  .chip{pointer-events:auto;cursor:pointer;font-size:13px;color:var(--dim);
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--stroke);background:rgba(12,12,14,.5);border-radius:999px;padding:6px 14px;transition:.2s}
  .chip:hover{color:var(--ink);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
  .chip-upload{border-style:dashed;color:#c9d2dc}
  .chip-upload.active{color:#000;background:#fff;border-color:#fff;border-style:solid}

  .controls{position:fixed;right:16px;bottom:20px;display:flex;gap:8px;z-index:20}
  .ctrl{width:42px;height:42px;border-radius:13px;border:1px solid var(--stroke);
    background:rgba(12,12,14,.62);backdrop-filter:blur(12px);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s}
  .ctrl:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.42)}
  .ctrl:active{transform:scale(.94)}
  .ctrl svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  body.hide-ui .ui{display:none}
  body.export-locked .ui,body.export-locked .controls,body.export-locked .modal{display:none!important}

  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);pointer-events:auto;touch-action:none}
  .modal.open{display:flex}
  .modal-card{width:min(560px,100%);max-height:84vh;display:flex;flex-direction:column;
    background:rgba(14,14,16,.96);border:1px solid var(--stroke);border-radius:18px;
    box-shadow:0 24px 80px rgba(0,0,0,.72);animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:13.5px;font-weight:600;
    padding:8px 12px;border-radius:10px;cursor:pointer;transition:.16s}
  .tab:hover{color:#fff;background:rgba(255,255,255,.07)}
  .tab.active{color:#000;background:#fff}
  .modal-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:transparent;
    color:#fff;font-size:20px;line-height:1;cursor:pointer;transition:.18s}
  .modal-close:hover{background:rgba(255,255,255,.12)}
  .modal-body{padding:6px 16px 18px;overflow:auto;overscroll-behavior:contain}
  .pane{display:none;animation:fade .2s ease}
  .pane.active{display:block}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .row>span{font-size:13.5px;color:#e9edf3}
  .row select,.row input[type=color]{border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    color:#fff;border-radius:9px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:130px}
  .row input[type=color]{padding:0;width:48px;height:32px;min-width:48px;cursor:pointer;overflow:hidden}
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .row input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}
  .row input[type=color]::-moz-color-swatch{border:0;border-radius:9px}
  .row input[type=range]{width:150px;accent-color:var(--accent)}
  .row input[type=number]{border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    color:#fff;border-radius:9px;padding:6px 10px;font-family:inherit;font-size:13px;width:130px;
    min-width:130px;text-align:left;box-sizing:border-box;-moz-appearance:textfield;appearance:textfield}
  .row input[type=number]::-webkit-inner-spin-button,
  .row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
  /* 自绘下拉：与面板同风格（深色毛玻璃 / 细边 / 圆角 / hover 高亮） */
  .row .sel{position:relative;flex:none;min-width:130px}
  .sel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;
    font-size:13px;border-radius:9px;padding:6px 10px;cursor:pointer;transition:.16s;text-align:left}
  .sel-btn:hover{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.09)}
  .sel-btn .sel-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sel-btn .arw{flex:none;display:flex;opacity:.65;transition:transform .2s}
  .sel.open .sel-btn{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
  .sel.open .sel-btn .arw{transform:rotate(180deg)}
  .sel-list{position:fixed;top:0;left:0;z-index:9999;min-width:0;
    background:rgba(16,16,18,.98);border:1px solid var(--stroke);border-radius:11px;padding:5px;
    box-shadow:0 18px 50px rgba(0,0,0,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    display:none;max-height:min(280px,52vh);overflow:auto;animation:pop .16s ease}
  .sel-list.show{display:block}
  .sel-list .opt{padding:7px 10px;border-radius:8px;font-size:13px;color:#d7dce3;cursor:pointer;
    white-space:nowrap;transition:.12s}
  .sel-list .opt:hover{background:rgba(255,255,255,.11);color:#fff}
  .sel-list .opt.on{color:#000;background:#fff}
  .switch i{width:44px;height:25px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;
    display:inline-block;transition:.2s;flex:none}
  .switch i:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:.2s}
  .switch input{display:none}
  .switch input:checked+i{background:var(--accent)}
  .switch input:checked+i:after{transform:translateX(19px);background:#111111}
  .switch{cursor:pointer}
  .group-title{font-size:11.5px;letter-spacing:.16em;color:var(--dim);margin:16px 2px 4px}

  .exp-row{display:flex;gap:10px;margin-top:10px}
  .exp-go{flex:1;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;
    font-size:13.5px;font-weight:600;padding:12px 0;border-radius:11px;cursor:pointer;transition:.16s}
  .exp-go:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}

  .exp-card{width:min(680px,100%)}
  .exp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
  .exp-title{font-size:13.5px;font-weight:600;color:#e9edf3;letter-spacing:.04em}
  .exp-preview{margin:14px 16px;border:1px solid var(--stroke);border-radius:12px;background:rgba(0,0,0,.35);
    overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:220px;max-height:56vh}
  .exp-preview img,.exp-preview video{max-width:100%;max-height:56vh;display:block}
  .exp-preview iframe{width:100%;height:56vh;border:0;background:#000}
  .exp-preview .exp-hint{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
  .exp-actions{display:flex;justify-content:flex-end;gap:10px;padding:2px 16px 16px}
  .exp-cancel{border:1px solid var(--stroke);background:transparent;color:#fff;font-family:inherit;font-size:13px;
    font-weight:600;padding:9px 24px;border-radius:10px;cursor:pointer;transition:.16s}
  .exp-cancel:hover{background:rgba(255,255,255,.12)}
  .exp-download{border:0;background:#fff;color:#000;font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 24px;border-radius:10px;cursor:pointer;transition:.16s}
  .exp-download:hover{filter:brightness(.9)}

  .about{text-align:center;padding:26px 6px 10px}
  .about .brand{font-size:34px;font-weight:800;letter-spacing:.34em;text-indent:.34em}
  .about .slogan{margin-top:8px;font-size:12.5px;color:var(--dim);letter-spacing:.18em}
  .about .ver{margin-top:20px;font-size:12.5px;color:var(--dim);letter-spacing:.1em}
  .about .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);margin:22px 0 16px}
  .about .copy{font-size:12px;color:var(--dim);letter-spacing:.06em;line-height:1.9}

  @media (max-width:480px){
    :root{--ui-gap:11px}
    .hint{font-size:12px}
    .row select{min-width:110px}
    .row input[type=range]{width:110px}
    .modal-card{max-height:88vh}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="ui">
  <div class="panel">
    <input id="text" type="text" maxlength="24" placeholder="输入文字或拖入图片..." value="〇" />
    <button id="go">生成</button>
  </div>
  <div class="chips">
    <span class="chip" data-t="〇">〇</span>
    <span class="chip" data-t="HUBOOK">HUBOOK</span>
    <span class="chip" data-t="GAUCN">GAUCN</span>
    <span class="chip" data-t="你好，世界！">你好，世界！</span>
    <span class="chip" id="yearChip"></span>
    <span class="chip chip-upload" id="uploadChip"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>图片</span>
  </div>
  <input type="file" id="fileImg" accept="image/*" hidden />
</div>

<div class="controls">
  <button class="ctrl" id="toggleUI" title="隐藏 / 显示界面" aria-label="隐藏或显示界面"></button>
  <button class="ctrl" id="openSettings" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="tabs">
        <button class="tab active" data-tab="display">显示</button>
        <button class="tab" data-tab="particle">粒子</button>
        <button class="tab" data-tab="effect">特效</button>
        <button class="tab" data-tab="export">导出</button>
        <button class="tab" data-tab="about">关于</button>
      </div>
      <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">

      <section class="pane active" data-pane="display">
        <label class="row switch"><span>彩色星尘</span><input type="checkbox" id="cColorful"><i></i></label>
        <div class="row" id="rowTheme"><span>主题</span><select id="cTheme"></select></div>
        <div class="row" id="rowPColor"><span>星尘色</span><input type="color" id="cPColor" value="#ffffff"></div>
        <div class="row" id="rowBg"><span>背景色</span><input type="color" id="cBg" value="#000000"></div>
      </section>

      <section class="pane" data-pane="particle">
        <div class="row"><span>材质</span>
          <select id="cMatter">
            <option value="glow">柔光</option><option value="dot">实心圆</option>
            <option value="concentric">同心圆</option>
            <option value="spark">星芒</option><option value="square">方块</option>
            <option value="snow">雪花</option><option value="ring">光环</option>
            <option value="bubble">气泡</option>
          </select></div>
        <div class="row"><span>密度</span><input type="range" id="cDensity" min="-3" max="4" step="1" value="3"></div>
        <div class="row"><span>分散</span><input type="range" id="cSpread" min="0" max="200" step="1" value="100"></div>
        <div class="row"><span>大小</span><input type="range" id="cSize" min="50" max="180" step="1" value="100"></div>
      </section>

      <section class="pane" data-pane="effect">
        <div class="row"><span>移动效果</span>
          <select id="cHover"><option value="push">推开</option><option value="attract">吸引</option><option value="trail">拖尾</option><option value="beam">光束</option><option value="none">无</option></select></div>
        <div class="row"><span>点击效果</span>
          <select id="cClick"><option value="explode">爆炸</option><option value="vortex">漩涡</option><option value="wave">海浪</option><option value="none">无</option></select></div>
        <div class="row"><span>背景动画</span>
          <select id="cIdle"><option value="drift">轻飘</option><option value="still">静止</option></select></div>
        <label class="row switch"><span>自动播放</span><input type="checkbox" id="cLoop" checked><i></i></label>
        <div class="row" id="rowAutoPos"><span>触发位置</span>
          <select id="cAutoPos"><option value="center">中心</option><option value="random">随机</option></select></div>
        <div class="row" id="rowAutoSec"><span>间隔时长</span><input type="number" id="cAutoSec" min="1" max="600" step="1" value="5"></div>
      </section>

      <section class="pane" data-pane="export">
        <div class="exp-row">
          <button class="exp-go" data-exp="image">图片</button>
          <button class="exp-go" data-exp="video">视频</button>
          <button class="exp-go" data-exp="web">网页</button>
        </div>
      </section>

      <section class="pane" data-pane="about">
        <div class="about">
          <div class="brand">MOTE</div>
          <div class="slogan">让光汇聚成你想要的形状</div>
          <div class="ver">版本 1.0</div>
          <div class="rule"></div>
          <div class="copy">©2026 上海旧川科技有限公司 版权所有</div>
        </div>
      </section>

    </div>
  </div>
</div>

<div class="modal" id="expModal">
  <div class="modal-card exp-card">
    <div class="exp-head">
      <span class="exp-title" id="expTitle">预览</span>
      <button class="modal-close" id="expClose" aria-label="关闭">×</button>
    </div>
    <div class="exp-preview" id="expPreview"></div>
    <div class="exp-actions">
      <button class="exp-cancel" id="expCancel">取消</button>
      <button class="exp-download" id="expDownload">下载</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha:false });
  var input = document.getElementById('text');
  var goBtn = document.getElementById('go');
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif';

  var THEMES = {
    white:  { name:'纯白',   p:'#ffffff', bg:'#000000' },
    cyan:   { name:'赛博蓝', p:'#5ad7ff', bg:'#02060f' },
    sunset: { name:'落日',   p:'#ffb070', bg:'#120603' },
    aurora: { name:'极光',   p:'#7bffc4', bg:'#041008' },
    sakura: { name:'樱粉',   p:'#ff9ec7', bg:'#0d040a' },
    gold:   { name:'香槟金', p:'#ffd98a', bg:'#0b0902' }
  };

  var DEFAULTS = {
    sourceType:'text', text:'〇', imageData:null, imageName:'',
    colorful:false, theme:'white', particleColor:'#ffffff', bgColor:'#000000',
    matter:'glow', density:3, spread:1.0, size:1.0,
    cursor:'crosshair', hover:'push', click:'explode', idle:'drift', loop:true, autoPos:'center', autoSec:5,
    exportMode:false, wallpaper:false
  };
  var cfg = {};
  for (var k in DEFAULTS) cfg[k] = DEFAULTS[k];
  if (window.__MOTE__){ for (var k2 in window.__MOTE__) cfg[k2] = window.__MOTE__[k2]; }
  if (cfg.text == null) cfg.text = '〇';

  var SRC = { imageEl:null };

  function hexToRgb(h){ h=(h||'#000').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
  function hsl2hex(h,s,l){ s/=100; l/=100;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r=0,g=0,b=0;
    if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
    function f(v){ return ('0'+Math.round((v+m)*255).toString(16)).slice(-2); }
    return '#'+f(r)+f(g)+f(b); }
  function qHex(r,g,b){ function q(v){ return Math.min(255, Math.round(v/32)*32); }
    return '#'+[q(r),q(g),q(b)].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join(''); }

  var spriteCache = {};
  function spriteFor(style, hex){
    var key = style + '|' + hex;
    if (spriteCache[key]) return spriteCache[key];
    var S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d');
    var rgb = hexToRgb(hex), col = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',';
    if (style === 'dot'){
      g.fillStyle = col+'1)'; g.beginPath(); g.arc(S/2,S/2,S*0.2,0,6.2832); g.fill();
      var gg1 = g.createRadialGradient(S/2,S/2,S*0.16,S/2,S/2,S/2);
      gg1.addColorStop(0,col+'0.55)'); gg1.addColorStop(1,col+'0)');
      g.fillStyle = gg1; g.fillRect(0,0,S,S);
    } else if (style === 'square'){

    var url;
    try { url = canvas.toDataURL('image/png'); }
    catch(err){ expPreview.innerHTML = '<span class="exp-hint">生成失败</span>'; return; }
    var im = new Image(); im.alt = '图片'; im.src = url; showExp(im);
    setDl(function(){ return url; }, fileBase()+'.png');
  }
  function pickVideoMime(){
    if (typeof MediaRecorder === 'undefined') return null;
    var list = [['video/mp4;codecs=avc1.42E01E','mp4'],['video/mp4','mp4'],
      ['video/webm;codecs=vp9','webm'],['video/webm;codecs=vp8','webm'],['video/webm','webm']];
    for (var i=0;i<list.length;i++){ try{ if (MediaRecorder.isTypeSupported(list[i][0])) return { mime:list[i][0], ext:list[i][1] }; }catch(e){} }
    return null;
  }
  function exportVideo(){
    openExp('视频预览');
    var pick = pickVideoMime();
    if (!pick){ expPreview.innerHTML = '<span class="exp-hint">当前浏览器不支持视频录制</span>'; return; }
    var stream, rec;
    try{ stream = canvas.captureStream(30); }catch(err){ expPreview.innerHTML = '<span class="exp-hint">无法获取视频流</span>'; return; }
    try{ rec = new MediaRecorder(stream, { mimeType:pick.mime, videoBitsPerSecond:8000000 }); }
    catch(err){ try{ rec = new MediaRecorder(stream); pick = { mime:rec.mimeType||'video/webm', ext:'webm' }; }
      catch(err2){ expPreview.innerHTML = '<span class="exp-hint">录制失败</span>'; return; } }
    var chunks = [];
    rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      var blob = new Blob(chunks, { type:pick.mime });
      var v = document.createElement('video');
      v.controls = true; v.autoplay = true; v.loop = true; v.muted = true;
      v.src = URL.createObjectURL(blob); showExp(v);
      setDl(function(){ return blob; }, fileBase()+'.'+pick.ext);
    };
    rec.start();
    explode(W/2, H/2);
    setTimeout(function(){ if (rec.state==='recording') explode(W/2, H/2); }, 2000);
    setTimeout(function(){ try{ rec.stop(); }catch(e){} }, 4000);
  }
  function exportCfg(wall){
    return { sourceType:cfg.sourceType, text:cfg.text,
      imageData: (cfg.sourceType==='image' ? cfg.imageData : null),
      colorful:cfg.colorful, theme:cfg.theme, particleColor:cfg.particleColor, bgColor:cfg.bgColor,
      matter:cfg.matter, density:cfg.density, spread:cfg.spread, size:cfg.size,
      cursor:cfg.cursor, hover:cfg.hover, click:cfg.click, idle:cfg.idle, loop:cfg.loop,
      autoPos:cfg.autoPos, autoSec:cfg.autoSec,
      exportMode:true, wallpaper:!!wall };
  }
  function buildInteractive(wall){
    var root = document.documentElement.cloneNode(true);
    var body = root.querySelector('body');
    if (body) body.classList.add('export-locked');
    var m = root.querySelector('#modal'); if (m) m.classList.remove('open');
    var head = root.querySelector('head');
    var s = document.createElement('script');
    s.textContent = 'window.__MOTE__=' + JSON.stringify(exportCfg(wall)) + ';';
    head.insertBefore(s, head.firstChild);
    return '<!DOCTYPE html>\n' + root.outerHTML;
  }
  function exportWeb(){
    openExp('网页预览');
    var html = buildInteractive(false);
    var fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts allow-pointer-lock');
    fr.setAttribute('title', '网页预览');
    fr.srcdoc = html;
    showExp(fr);
    setDl(function(){ return new Blob([html], { type:'text/html' }); }, fileBase()+'.html');
  }
  var expBtns = document.querySelectorAll('.exp-go');
  for (var ei=0;ei<expBtns.length;ei++){ (function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var t = b.getAttribute('data-exp');
      if (t==='image') exportImage();
      else if (t==='video') exportVideo();
      else if (t==='web') exportWeb();
    });
  })(expBtns[ei]); }

  if (cfg.sourceType === 'image' && cfg.imageData){
    var im = new Image();
    im.onload = function(){ SRC.imageEl = im; rebuild(); };
    im.src = cfg.imageData;
  }
  if (cfg.exportMode){
    setTimeout(function(){ var h = document.querySelector('.hint'); if (h) h.style.display='none'; }, 4200);
  }
  enhanceSelects();
  syncControls();
  syncEye();
  updateSrcUI();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
