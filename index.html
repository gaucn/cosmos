<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>MOTED</title>
<style>
  :root{
    --ink:#ffffff; --dim:#8b8f9a; --stroke:rgba(255,255,255,.14);
    --accent:#c9ced6; --ui-gap:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:#000;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.6) 100%)}

  .ui{position:fixed;left:0;right:0;top:0;padding:18px 16px;
    display:flex;flex-direction:column;align-items:center;gap:var(--ui-gap);pointer-events:none;z-index:5}
  .panel{pointer-events:auto;display:flex;align-items:center;gap:8px;
    background:rgba(10,10,12,.55);border:1px solid var(--stroke);border-radius:16px;padding:8px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);width:min(580px,100%)}
  .panel input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);
    font-size:16px;padding:10px 12px;letter-spacing:.02em;text-align:center;-webkit-user-select:text;user-select:text}
  .panel input::placeholder{color:var(--dim)}
  .panel input.drop{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
    border-radius:10px}

  .srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  .src{pointer-events:auto;cursor:pointer;font-size:12.5px;color:var(--dim);
    border:1px solid var(--stroke);background:rgba(12,12,14,.5);border-radius:999px;padding:5px 14px;transition:.2s}
  .src.active{color:#000;background:#fff;border-color:#fff}
  .src:hover{color:var(--ink);border-color:rgba(255,255,255,.5)}
  .srcname{font-size:12px;color:var(--dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;pointer-events:none}
  .chip{pointer-events:auto;cursor:pointer;font-size:13px;color:var(--dim);
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--stroke);background:rgba(12,12,14,.5);border-radius:999px;padding:6px 14px;transition:.2s}
  .chip:hover{color:var(--ink);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
  .chip-upload{border-style:dashed;color:#c9d2dc}
  .chip-upload.active{color:#000;background:#fff;border-color:#fff;border-style:solid}

  .controls{position:fixed;right:16px;bottom:20px;display:flex;gap:8px;z-index:20}
  .ctrl{width:42px;height:42px;border-radius:13px;border:1px solid var(--stroke);
    background:rgba(12,12,14,.62);backdrop-filter:blur(12px);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s}
  .ctrl:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.42)}
  .ctrl:active{transform:scale(.94)}
  .ctrl svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ctrl-about{display:none}
  body.ui-read .ctrl:not(.ctrl-about){display:none}
  body.ui-read .ctrl-about{display:flex}
  body.ui-read .ui{display:none}
  body.ui-read .tabs{display:none}

  body.hide-ui .ui{display:none}
  body.export-locked .ui,body.export-locked .controls,body.export-locked .modal{display:none!important}

  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);pointer-events:auto;touch-action:none}
  .modal.open{display:flex}
  .modal-card{width:min(560px,100%);max-height:84vh;display:flex;flex-direction:column;
    background:rgba(14,14,16,.96);border:1px solid var(--stroke);border-radius:18px;
    box-shadow:0 24px 80px rgba(0,0,0,.72);animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  .tab{border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:13.5px;font-weight:600;
    padding:8px 12px;border-radius:10px;cursor:pointer;transition:.16s}
  .tab:hover{color:#fff;background:rgba(255,255,255,.07)}
  .tab.active{color:#000;background:#fff}
  .modal-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:transparent;
    color:#fff;font-size:20px;line-height:1;cursor:pointer;transition:.18s;order:2}
  .modal-close:hover{background:rgba(255,255,255,.12)}
  .modal-link{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--stroke);
    background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;transition:.18s;order:1}
  .modal-link:hover{background:rgba(255,255,255,.12)}
  .modal-link svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  body.ui-read .modal-head .modal-close{order:1}
  body.ui-read .modal-head .modal-link{order:2}
  .modal-body{padding:6px 16px 18px;overflow:auto;overscroll-behavior:contain}
  .pane{display:none;animation:fade .2s ease}
  .pane.active{display:block}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .row>span{font-size:13.5px;color:#e9edf3}
  .row select,.row input[type=color]{border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    color:#fff;border-radius:9px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:130px}
  .row input[type=color]{padding:0;width:48px;height:32px;min-width:48px;cursor:pointer;overflow:hidden}
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .row input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}
  .row input[type=color]::-moz-color-swatch{border:0;border-radius:9px}
  .row input[type=color].rainbow::-webkit-color-swatch{background:linear-gradient(120deg,#ff4d4d,#ffd24d,#7dff8a,#4dd6ff,#7a8bff,#e35bff)}
  .row input[type=color].rainbow::-moz-color-swatch{background:linear-gradient(120deg,#ff4d4d,#ffd24d,#7dff8a,#4dd6ff,#7a8bff,#e35bff)}
  .row input[type=range]{width:150px;accent-color:var(--accent)}
  .row input[type=number]{border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    color:#fff;border-radius:9px;padding:6px 10px;font-family:inherit;font-size:13px;width:130px;
    min-width:130px;text-align:left;box-sizing:border-box;-moz-appearance:textfield;appearance:textfield}
  .row input[type=number]::-webkit-inner-spin-button,
  .row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
  /* 自绘下拉：与面板同风格（深色毛玻璃 / 细边 / 圆角 / hover 高亮） */
  .row .sel{position:relative;flex:none;min-width:130px}
  .sel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;
    font-size:13px;border-radius:9px;padding:6px 10px;cursor:pointer;transition:.16s;text-align:left}
  .sel-btn:hover{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.09)}
  .sel-btn .sel-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sel-btn .arw{flex:none;display:flex;opacity:.65;transition:transform .2s}
  .sel.open .sel-btn{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
  .sel.open .sel-btn .arw{transform:rotate(180deg)}
  .sel-list{position:fixed;top:0;left:0;z-index:9999;min-width:0;
    background:rgba(16,16,18,.98);border:1px solid var(--stroke);border-radius:11px;padding:5px;
    box-shadow:0 18px 50px rgba(0,0,0,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    display:none;max-height:min(280px,52vh);overflow:auto;animation:pop .16s ease}
  .sel-list.show{display:block}
  .sel-list .opt{padding:7px 10px;border-radius:8px;font-size:13px;color:#d7dce3;cursor:pointer;
    white-space:nowrap;transition:.12s}
  .sel-list .opt:hover{background:rgba(255,255,255,.11);color:#fff}
  .sel-list .opt.on{color:#000;background:#fff}
  .switch i{width:44px;height:25px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;
    display:inline-block;transition:.2s;flex:none}
  .switch i:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:.2s}
  .switch input{display:none}
  .switch input:checked+i{background:var(--accent)}
  .switch input:checked+i:after{transform:translateX(19px);background:#111111}
  .switch{cursor:default}
  .switch .sw{cursor:pointer;display:inline-flex;flex:none}
  .row.col{flex-direction:column;align-items:stretch;gap:9px}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .theme-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 8px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:11px;cursor:pointer;
    font-family:inherit;transition:.16s}
  .theme-box:hover{border-color:rgba(255,255,255,.4)}
  .theme-box.on{border-color:#fff;background:rgba(255,255,255,.14)}
  .tb-swatch{position:relative;width:40px;height:27px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  .tb-bg{position:absolute;inset:0}
  .tb-dot{position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 7px currentColor}
  .theme-box span{font-size:11px;letter-spacing:.06em;color:var(--dim)}
  .theme-box.on span{color:#fff}
  .exp-row{display:flex;gap:10px;margin-top:10px}
  .exp-unit{flex:1;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:16px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:12px;padding:16px;transition:.16s}
  .exp-unit:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}
  .exp-unit .exp-go{flex:none;width:100%;border:0;background:transparent;padding:0;border-radius:0;
    font-family:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.16s}
  .exp-unit .exp-go:hover{background:transparent;border-color:transparent}
  .exp-unit .sel{width:100%}
  .exp-go{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;
    font-size:14px;font-weight:600;padding:26px 0;border-radius:12px;cursor:pointer;transition:.16s}
  .exp-tag{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--dim)}
  .exp-go:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
  .exp-go:disabled{cursor:default;background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.09);color:rgba(255,255,255,.4)}
  .exp-go:disabled .exp-tag{color:rgba(255,255,255,.22)}
  .exp-go:disabled:hover{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.09)}

  .share-row{display:flex;gap:8px;margin-top:14px}
  .share-url{flex:1;min-width:0;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#dfe4ea;
    border-radius:11px;padding:13px 12px;font-family:inherit;font-size:13px;letter-spacing:.02em;cursor:default}
  .share-url:focus{outline:0}
  .share-copy{flex:none;width:46px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;
    border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
  .share-copy:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
  .share-copy:active{transform:scale(.95)}
  .share-copy svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .share-copy.done{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.16)}

  .cwrap{display:inline-flex;align-items:center;gap:8px;flex:none}
  .hexinp{width:104px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;
    border-radius:9px;padding:6px 8px;font-family:inherit;font-size:12.5px;letter-spacing:.04em;
    -webkit-user-select:text;user-select:text}
  .hexinp:focus{outline:0;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.09)}
  .hexinp.bad{border-color:rgba(255,120,120,.85);background:rgba(255,80,80,.12)}

  .exp-card{width:min(680px,100%)}
  .exp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
  .exp-title{font-size:13.5px;font-weight:600;color:#e9edf3;letter-spacing:.04em}
  .exp-preview{margin:14px 16px;border:1px solid var(--stroke);border-radius:12px;background:rgba(0,0,0,.35);
    overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:220px;max-height:56vh}
  .exp-preview img,.exp-preview video{max-width:100%;max-height:56vh;display:block}
  .exp-preview iframe{width:100%;height:56vh;border:0;background:#000}
  .exp-preview .exp-hint{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
  .exp-actions{display:flex;justify-content:flex-end;gap:10px;padding:2px 16px 16px}
  .exp-cancel{border:1px solid var(--stroke);background:transparent;color:#fff;font-family:inherit;font-size:13px;
    font-weight:600;padding:9px 24px;border-radius:10px;cursor:pointer;transition:.16s}
  .exp-cancel:hover{background:rgba(255,255,255,.12)}
  .exp-download{border:0;background:#fff;color:#000;font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 24px;border-radius:10px;cursor:pointer;transition:.16s}
  .exp-download:hover{filter:brightness(.9)}

  .about{text-align:center;padding:26px 6px 10px}
  .about .brand{font-size:34px;font-weight:800;letter-spacing:.34em;text-indent:.34em;padding:24px 0}
  .about .gh{display:inline-flex;align-items:center;gap:8px;margin-top:6px;color:var(--dim);font-size:13px;letter-spacing:.14em;text-decoration:none;transition:color .2s}
  .about .gh svg{width:18px;height:18px;fill:currentColor;display:block}
  .about .gh:hover{color:#fff}
  .about .about-links{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-top:12px}
  .about .about-links .gh{margin-top:0}
  .about .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);margin:22px 0 16px}
  .about .copy{font-size:12px;color:var(--dim);letter-spacing:.06em;line-height:1.9}

  @media (max-width:480px){
    :root{--ui-gap:11px}
    .hint{font-size:12px}
    .row select{min-width:110px}
    .row input[type=range]{width:110px}
    .modal-card{max-height:88vh}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="ui">
  <div class="panel">
    <input id="text" type="text" maxlength="24" placeholder="输入文字或拖入图片..." value="〇" />
  </div>
  <div class="chips">
    <span class="chip" data-t="〇">〇</span>
    <span class="chip" data-t="HUBOOK">HUBOOK</span>
    <span class="chip" data-t="GAUCN">GAUCN</span>
    <span class="chip" id="yearChip"></span>
    <span class="chip" data-t="你好，世界！">你好，世界！</span>
    <span class="chip chip-upload" id="uploadChip"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>图片</span>
  </div>
  <input type="file" id="fileImg" accept="image/*" hidden />
</div>

<div class="controls">
  <button class="ctrl" id="toggleUI" title="隐藏 / 显示界面" aria-label="隐藏或显示界面"></button>
  <button class="ctrl" id="openSettings" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="ctrl ctrl-about" id="openAbout" title="关于" aria-label="关于">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.01"/></svg>
  </button>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="tabs">
        <button class="tab active" data-tab="display">显示</button>
        <button class="tab" data-tab="particle">粒子</button>
        <button class="tab" data-tab="effect">特效</button>
        <button class="tab" data-tab="export">分享</button>
        <button class="tab" data-tab="about">关于</button>
      </div>
      <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
      <a class="modal-link" href="http://cosmos.gaucn.com" target="_blank" rel="noopener noreferrer" title="Cosmos 官网" aria-label="Cosmos 官网">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M12 3c2.4 2.6 3.6 5.7 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.7-3.6-9S9.6 5.6 12 3z"/></svg>
      </a>
    </div>
    <div class="modal-body">

      <section class="pane active" data-pane="display">
        <div class="row switch"><span>原彩</span><label class="sw"><input type="checkbox" id="cColorful"><i></i></label></div>
        <div class="row col" id="rowTheme"><span>主题</span>
          <div class="theme-grid" id="themeGrid"></div></div>
        <div class="row" id="rowPColor"><span>星尘色</span><span class="cwrap"><input type="color" id="cPColor" value="#ffffff"><input type="text" class="hexinp" id="cPColorHex" spellcheck="false" maxlength="9" value="#ffffff" aria-label="星尘色十六进制"></span></div>
        <div class="row" id="rowBg"><span>背景色</span><span class="cwrap"><input type="color" id="cBg" value="#000000"><input type="text" class="hexinp" id="cBgHex" spellcheck="false" maxlength="9" value="#000000" aria-label="背景色十六进制"></span></div>
        <div class="row" id="rowStarFx"><span>星尘效果</span>
          <select id="cStarFx">
            <option value="rainbow">幻彩色标</option>
            <option value="cycle">色相循环</option>
            <option value="flow">流光渐变</option>
            <option value="confetti">缤纷彩虹</option>
          </select></div>
        <div class="row" id="rowFxDir"><span>渐变方向</span>
          <select id="cFxDir">
            <option value="h">横向</option>
            <option value="v">纵向</option>
            <option value="d">斜向</option>
          </select></div>
        <div class="row" id="rowFloat"><span>星光色</span><span class="cwrap"><input type="color" id="cFloat" value="#ffffff"><input type="text" class="hexinp" id="cFloatHex" spellcheck="false" maxlength="9" value="" placeholder="跟随" aria-label="星光色十六进制"></span></div>

  var SH = { x:0, y:0 }, spmx = 0, spmy = 0, spInit = false;   /* 视差位移：前景跟随鼠标运动（位移大），背景反向且更慢（位移小）；停下后缓缓归位 */
  /* 吞噬：鼠标化为小球，吞入星尘与漂浮粒子而变大；撞到边框被磨掉吐出，离开则全部释放归位 */
  var dev = { r: 15 };
  function devCap(o){
    o.cap = true;
    o.ca = Math.atan2(o.y-my, o.x-mx);
    var ddx = o.x-mx, ddy = o.y-my;
    o.cd = Math.max(0.12, Math.min(1, Math.sqrt(ddx*ddx+ddy*ddy)/Math.max(1, dev.r)));
    o.cs = (Math.random()<0.5?-1:1)*(0.4+Math.random()*0.6);
  }
  function devRel(o){ if (!o.cap) return; o.cap = false; o.vx += (Math.random()-0.5)*1.6; o.vy += (Math.random()-0.5)*1.6; }
  function devCount(){ var c=0,i; for(i=0;i<particles.length;i++) if(particles[i].cap) c++; for(i=0;i<stars.length;i++) if(stars[i].cap) c++; return c; }
  function devRelease(drop){
    var i, n=0;
    if (!drop){ for(i=0;i<particles.length;i++) devRel(particles[i]); for(i=0;i<stars.length;i++) devRel(stars[i]); return; }
    for(i=0;i<particles.length && n<drop;i++){ if (particles[i].cap){ devRel(particles[i]); n++; } }
    for(i=0;i<stars.length && n<drop;i++){ if (stars[i].cap){ devRel(stars[i]); n++; } }

  var bbox = { x0:0, y0:0, x1:0, y1:0 };

  function makeParticle(x,y){
    return { x:x, y:y, vx:0, vy:0, tx:x, ty:y, baseR:4.4, srcColor:null, rx:0, ry:0,
      ph:Math.random()*6.2832, sp:Math.random()*0.5+0.28, a:Math.random()*0.4+0.35, br:0 };
  }
  function ensurePool(n){
    while (particles.length < n) particles.push(makeParticle(Math.random()*W, Math.random()*H));
    if (particles.length > n) particles.length = n;
  }
  function computeBBox(){
    if (!particles.length){ bbox = { x0:W/2-40, y0:H/2-40, x1:W/2+40, y1:H/2+40 }; return; }
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for (var i=0;i<particles.length;i++){ var p=particles[i];
      if(p.tx<x0)x0=p.tx; if(p.tx>x1)x1=p.tx; if(p.ty<y0)y0=p.ty; if(p.ty>y1)y1=p.ty; }
    bbox = { x0:x0, y0:y0, x1:x1, y1:y1 };
  }
  function rebuild(){
    var pts = sampleSource();
    if (!pts.length){ particles.length = 0; computeBBox(); if (cfg.idle === 'river') initRibbons(); return; }
    ensurePool(pts.length);
    var isImg = (cfg.sourceType === 'image');
    if (isImg) buildImgPalette(pts);
    for (var i=0;i<particles.length;i++){
      var p = particles[i], t = pts[i];
      p.tx = t.x; p.ty = t.y;
      p.srcColor = isImg ? qHex.apply(null, adjustColor(t.r,t.g,t.b)) : null;   /* 文字按「星尘效果」在绘制时实时取色 */
      p.rc = Math.random();                            /* 稳定随机（保留字段） */
      p.baseR = 3.6 + Math.random()*1.8;
      p.br = Math.random()*6.2832;
      p.rx = Math.random() + Math.random() - 1;   /* 三角分布 [-1,1]，作为随机偏移方向分量 */
      p.ry = Math.random() + Math.random() - 1;
    }
    computeBBox();
    state = 'forming';
    if (cfg.idle === 'river') initRibbons();   /* 图形变化后，河流起点重新锚定到新图形 */
  }

  var stars = [];
  function initStars(){
    var n = Math.round(Math.min(160, Math.max(70, W*H/11000)));
    stars = [];
    for (var i=0;i<n;i++){
      var ang = Math.random()*6.2832, spd = 0.12 + Math.random()*0.5;
      var bvx = Math.cos(ang)*spd, bvy = Math.sin(ang)*spd;
      stars.push({ x:Math.random()*W, y:Math.random()*H, vx:bvx, vy:bvy, bvx:bvx, bvy:bvy,
        r:0.7+Math.random()*1.3, a:0.16+Math.random()*0.5,
        tw:Math.random()*6.2832, tsv:0.5+Math.random()*1.6, big:Math.random()<0.16, rc:Math.random() });
    }
  }

  var flows = [];
  function respawnFlow(f, initial){
    var edge = Math.floor(Math.random()*4), x, y;
    if (edge===0){ x=Math.random()*W; y=-20; }
    else if (edge===1){ x=W+20; y=Math.random()*H; }
    else if (edge===2){ x=Math.random()*W; y=H+20; }
    else { x=-20; y=Math.random()*H; }
    f.sx=x; f.sy=y;
    f.tx = bbox.x0 + Math.random()*(bbox.x1-bbox.x0);
    f.ty = bbox.y0 + Math.random()*(bbox.y1-bbox.y0);
    f.t = initial ? Math.random() : 0;
    f.sp = 0.16 + Math.random()*0.34;
    f.a = 0.18 + Math.random()*0.4;
    f.done = false;
  }
  function initFlows(){
    var n = Math.round(Math.min(90, Math.max(34, W/16)));
    flows = [];
    for (var i=0;i<n;i++){ var f={}; respawnFlow(f, true); flows.push(f); }
  }
  function flowEase(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function flowPt(f, t){ t=Math.max(0,Math.min(1,t)); var e=flowEase(t);
    return { x:f.sx+(f.tx-f.sx)*e, y:f.sy+(f.ty-f.sy)*e }; }

  /* ---------- 流光河流（从图形粒子本体出发，像河流般持续向下流淌） ---------- */
  var ribbons = [];
  /* 起点取自图形粒子的【当前实际位置】，让河流从图形内部向外流出 */
  function pickSeed(){
    if (particles.length){
      var p = particles[(Math.random()*particles.length)|0];
      return { x: p.x, y: p.y };
    }
    return { x: W/2, y: H/2 };
  }
  function makeRibbon(initial){
    var seed = pickSeed();
    var r = {
      sx: seed.x + (Math.random()-0.5)*30,   /* 起点 x，贴着粒子 */
      sy: seed.y + (Math.random()-0.5)*24,   /* 起点 y，贴着粒子 */
      y: 0,                                  /* 头部自起点起已向外流出的垂直距离 */
      len: 260 + Math.random()*520,          /* 线条更长 */
      spd: 60 + Math.random()*190,           /* 向外流速 px/s */
      amp: 5 + Math.random()*40,             /* 横向蜿蜒幅度 */
      freq: 0.004 + Math.random()*0.012,
      ph: Math.random()*6.2832,
      sw: 0.35 + Math.random()*0.95,         /* 蜿蜒波传播速度 */
      w: 0.35 + Math.random()*0.8,           /* 线条更细 */
      a: 0.14 + Math.random()*0.46
    };
    r.rnd = Math.random();
    if (cfg.colorful){ var rc0 = starTint(r.sx/W, r.sy/H, r.rnd, 0); r.hex = hsl2hex(wrapHue(rc0.h), rc0.s, rc0.l); }
    else { r.hex = cfg.particleColor; }
    r.rgb = hexToRgb(r.hex);
    r.y = initial ? Math.random() * (r.len + H) : Math.random() * 36;  /* 错开流出阶段 */
    return r;
  }
  function initRibbons(){
    var n = Math.round(Math.min(104, Math.max(44, W/12)));
    ribbons = [];
    for (var i=0;i<n;i++) ribbons.push(makeRibbon(true));
  }
  /* 自起点向下的某点横向位置：向外扩散 + 行波蜿蜒（起点处不偏移） */
  function ribbonX(r, y, time){
    var dy = y - r.sy;
    var ease = Math.max(0, Math.min(1, dy/95));            /* 起点处 0，往下逐渐展开 */
    var out = (r.sx - W/2) * Math.max(0, dy) / H * 0.35;   /* 越往下越向外扩散，形成外流 */

  function drawRiver(dt, time){

      var hr = 1.6 + r.w*1.6;

  }

  function explode(cx, cy){
    state = 'scatter'; scatterUntil = performance.now() + SCATTER_DUR;
    for (var i=0;i<particles.length;i++){

      var ang = Math.atan2(dy,dx) + (Math.random()-0.5)*0.7;
      var spd = 3.5 + Math.random()*8 + Math.min(6, 150/d);
      p.vx = Math.cos(ang)*spd; p.vy = Math.sin(ang)*spd;
    }
    shock = { x:cx, y:cy, r:6, a:0.8 };
  }
  /* 漩涡：粒子获得切向速度环绕旋转，叠加旋转弧视觉 */
  function vortex(cx, cy){
    state = 'scatter'; scatterUntil = performance.now() + SCATTER_DUR*1.5;
    for (var i=0;i<particles.length;i++){
      var p = particles[i], dx = p.x-cx, dy = p.y-cy, d = Math.hypot(dx,dy)||1;
      var tg = Math.atan2(dy,dx) + Math.PI/2;             /* 切向：绕中心旋转 */
      var spd = 2.5 + Math.random()*5 + Math.min(7, 190/d);
      var inw = 0.32;                                     /* 轻微向内卷入 */
      p.vx = Math.cos(tg)*spd - (dx/d)*spd*inw;
      p.vy = Math.sin(tg)*spd - (dy/d)*spd*inw;
    }
    swirl = { x:cx, y:cy, t:0, a:1.0 };
  }
  /* 海浪：以点击点为中心向外涌起的波浪（粒子随波峰方向荡开，叠加向外扩散的波动浪脊） */
  function wave(cx, cy){
    state = 'scatter'; scatterUntil = performance.now() + SCATTER_DUR*1.15;
    for (var i=0;i<particles.length;i++){
      var p = particles[i], dx = p.x-cx, dy = p.y-cy, d = Math.hypot(dx,dy)||1;
      var ang = Math.atan2(dy,dx);
      var crest = 0.55 + 0.45*Math.sin(d*0.05 - ang*2.5);   /* 角度上的波峰/波谷调制 */
      var spd = (1.8 + Math.min(7.5, 210/d)) * crest + Math.random()*1.3;
      p.vx += Math.cos(ang)*spd; p.vy += Math.sin(ang)*spd;
    }
    for (var wk=0; wk<3; wk++){
      waves.push({ x:cx, y:cy, r:8 + wk*30, a:0.5 - wk*0.12, vel:11 - wk*1.6, dec:0.965,
        rot: Math.random()*6.2832, arc: 1.2 + Math.random()*0.9, ph: Math.random()*6.2832 });

  }
  /* 坠落：文字粒子错峰、如尘埃般缓缓飘落，轻柔落地后整体缓缓升起归位；下滑带极淡尾迹 */
  var fallState = null;
  function fall(){
    state = 'fall';
    fallState = { t:0, dur:3.3 };
    for (var i=0;i<particles.length;i++){
      var p = particles[i];
      p.fw = Math.random()*0.8;          /* 错峰：0~0.8s 内先后开始下落，形成层次 */
      p.fq = false;                      /* 是否已开始下落 */
      p.fv = 0.8 + Math.random()*0.5;    /* 每颗尘粒的终端速度略有差异 → 更自然 */
      p.fs = (Math.random()-0.5)*0.6;    /* 轻微横向摇曳幅度 */
      p.vx = 0; p.vy = 0;
    }
    shock = null; swirl = null;
  }
  /* 统一分发点击效果（点击与自动播放共用） */
  function fireClick(x, y){
    var c = cfg.click;
    if (c === 'none') return;
    if (c === 'fall') fall();
    else if (c === 'vortex') vortex(x, y);
    else if (c === 'wave') wave(x, y);
    else explode(x, y);   /* 爆炸，含旧配置 ripple 等的回退 */
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var bg = hexToRgb(cfg.colorful ? '#000000' : cfg.bgColor);

    ctx.fillRect(0,0,W,H);
    initStars(); initFlows(); rebuild();
  }

  var lastNow = 0;
  /* 背景纹理：在淡出填充之后、粒子之前绘制，作为整体背景底纹 */
  /* 原彩·星尘效果：决定色相（u,v 为归一化坐标，r01 为稳定随机，t 为秒） */
  function starTint(u, v, r01, t){
    var fx = cfg.starFx || 'rainbow';
    if (fx === 'flow'){                                                                    /* 流光渐变：沿横向/纵向/斜向铺色并随时间流动 */
      var ax = (cfg.fxDir === 'v') ? v : (cfg.fxDir === 'd' ? (u + v) / 2 : u);
      return { h: ax * 300 + t * 45, s: 88, l: 62 };
    }
    if (fx === 'cycle') return { h: t * 36, s: 88, l: 62 };                                 /* 色相循环：整体色相随时间旋转 */
    if (fx === 'confetti') return { h: r01 * 360 + u * 40, s: 74 + u * 18, l: 56 + v * 16 }; /* 缤纷彩虹：每颗粒子随机色 + 轻微位置渐变 */
    return { h: u * 300, s: 88, l: 62 };                                                    /* 幻彩色标（默认，按横向位置取色） */
  }
  function wrapHue(h){ return ((h % 360) + 360) % 360; }
  function particleHex(p, t){
    if (!cfg.colorful) return cfg.particleColor;

    var c = starTint(p.tx / W, p.ty / H, p.rc || 0, t || 0);
    return hsl2hex(wrapHue(c.h), c.s, c.l);
  }
  function starHex(s, t){
    var c = starTint(s.x / W, s.y / H, s.rc || 0, t || 0);
    return hsl2hex(Math.round(wrapHue(c.h) / 18) * 18, c.s, c.l);
  }
  /* 图片调色板：从图片采样取代表色，供「跟随彩色」随机取用（指针光点 / 星光色 / 星尘） */
  var IMG_PALETTE = [];
  function buildImgPalette(pts){
    IMG_PALETTE = [];
    var seen = {}, step = Math.max(1, Math.floor(pts.length / 128));
    for (var i=0; i<pts.length; i+=step){
      var hex = qHex.apply(null, adjustColor(pts[i].r, pts[i].g, pts[i].b));
      if (!seen[hex]){ seen[hex] = 1; IMG_PALETTE.push(hex); if (IMG_PALETTE.length >= 128) break; }
    }
  }
  function imgRandHex(){ if (!IMG_PALETTE.length) return cfg.particleColor; return IMG_PALETTE[(Math.random()*IMG_PALETTE.length)|0]; }
  function imgStarHex(s){ if (!IMG_PALETTE.length) return cfg.particleColor; return IMG_PALETTE[Math.floor((s.rc||0)*IMG_PALETTE.length) % IMG_PALETTE.length]; }
  var ACCENT = { t:-999, hex:'#FFFFFF' };   /* 指针光点用的「跟随彩色」取样缓存 */
  function accentHex(time){
    if (!cfg.colorful) return cfg.particleColor;
    if (cfg.sourceType === 'image'){ if (time - ACCENT.t > 0.22){ ACCENT.t = time; ACCENT.hex = imgRandHex(); } return ACCENT.hex; }
    var r01 = (Math.floor((time || 0) / 0.5) % 9) / 9;                  /* 随机取色：每 0.5s 换一次，避免逐帧闪烁 */
    var c = starTint(mx / W, my / H, r01, time || 0);
    return hsl2hex(wrapHue(c.h), c.s, c.l);
  }
  function drawTexture(time){
    if (cfg.texture !== 'halo') return;   /* 仅保留「光晕」底纹 */
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    var cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.62);
    cg.addColorStop(0, 'rgba(206,214,255,0.05)');
    cg.addColorStop(0.5, 'rgba(178,168,255,0.02)');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.28, W/2, H/2, Math.max(W,H)*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  function drawCursorFx(time){
    var fx = cfg.cursorFx; if (!fx || fx === 'none' || !mActive) return;
    if (document.body.classList.contains('export-locked')) return;
    var x = mx, y = my;
    ctx.globalCompositeOperation = 'lighter';
    if (fx === 'halo'){                                    /* 光点：非原彩跟随星尘色，原彩跟随彩色取色 */
      var cc = hexToRgb(accentHex(time)) || [238,244,255];
      var cs = cc[0] + ',' + cc[1] + ',' + cc[2];
      var rr = 12 + Math.sin(time * 2.4) * 3.4;
      var g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, 'rgba(' + cs + ',0.6)');
      g.addColorStop(0.45, 'rgba(' + cs + ',0.2)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
    }
  }
  function frame(now){
    var dt = Math.min(48, lastNow ? (now - lastNow) : 16) / 16;
    lastNow = now;

    var bg = hexToRgb(cfg.colorful ? '#000000' : cfg.bgColor);
    ctx.globalCompositeOperation = 'source-over';
    var fadeA = (cfg.idle === 'river') ? 0.16 : (cfg.idle === 'warp' ? 0.26 : 0.30);
    ctx.fillStyle = 'rgba('+bg[0]+','+bg[1]+','+bg[2]+','+fadeA+')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    var time = now * 0.001;
    drawTexture(time);

    /* 吞噬：统计已吞数量决定球半径；撞到边框被磨掉，完全贴边或离开时全部吐出归位 */
    var devActive = (cfg.hover === 'devour') && mActive && state !== 'fall' && state !== 'scatter';
    if (devActive){
      var dCount = devCount();
      dev.r = Math.min(150, 15 + Math.sqrt(dCount)*3.6);
      var dEdge = Math.min(mx, W-mx, my, H-my);
      if (dEdge < 10) devRelease(0);                                   /* 完全贴边 → 全部吐出 */
      else if (dEdge < dev.r) devRelease(Math.max(1, Math.round(dCount*0.22)));   /* 碰到边框 → 磨掉一部分 */
    } else { devRelease(0); }

    var stick = (cfg.idle === 'still') ? 0.15 : 1;
    var bgStyle = (cfg.matter==='spark' ? 'glow' : cfg.matter);
    var warpOn = (cfg.idle === 'warp');
    var wcx = W/2, wcy = H/2, warpR = Math.sqrt(W*W + H*H)*0.5 + 60;

    /* 视差：鼠标移动时前景位移大、背景反向位移小；停下后缓缓归位 */
    var fgX = 0, fgY = 0, bgX = 0, bgY = 0;
    if (cfg.hover === 'parallax'){
      if (mActive){
        if (!spInit){ spmx = mx; spmy = my; spInit = true; }
        var smvx = mx - spmx, smvy = my - spmy;   /* 每帧只取一次鼠标位移 → 更平滑、不受事件频率影响 */
        spmx = mx; spmy = my;
        SH.x += smvx * 0.75; SH.y += smvy * 0.75;
      } else { spInit = false; }
      var shm = Math.sqrt(SH.x*SH.x + SH.y*SH.y);
      if (shm > 260){ SH.x = SH.x/shm*260; SH.y = SH.y/shm*260; }   /* 允许更大的位移 */
      fgX = SH.x; fgY = SH.y;
      bgX = -SH.x*0.34; bgY = -SH.y*0.34;                            /* 背景：反向、约三分之一 */
      SH.x *= 0.94; SH.y *= 0.94;                                    /* 衰减更慢 → 回弹更缓、更稳 */
      if (Math.abs(SH.x) < 0.15) SH.x = 0;
      if (Math.abs(SH.y) < 0.15) SH.y = 0;
    } else if (SH.x || SH.y){
      SH.x *= 0.8; SH.y *= 0.8;
      if (Math.abs(SH.x) < 0.2) SH.x = 0;
      if (Math.abs(SH.y) < 0.2) SH.y = 0;
    }

    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var wdx = s.x-wcx, wdy = s.y-wcy, wr = Math.sqrt(wdx*wdx+wdy*wdy)||0.0001;
      if (mActive && cfg.hover !== 'none' && cfg.hover !== 'trail' && cfg.hover !== 'beam' && cfg.hover !== 'devour' && cfg.hover !== 'parallax'){
        var dmx = s.x-mx, dmy = s.y-my, d2 = dmx*dmx+dmy*dmy, pr = PUSH_R*1.15;
        if (d2 < pr*pr){
          var dd = Math.sqrt(d2)||0.0001, dir = (cfg.hover==='attract'?-1:1);
          var ff = (1-dd/pr)*PUSH_S*dir;
          s.vx += (dmx/dd)*ff; s.vy += (dmy/dd)*ff;
        }
      }
      if (devActive){
        var sbx = s.x-mx, sby = s.y-my, sb2 = sbx*sbx+sby*sby;
        if (!s.cap && sb2 < dev.r*dev.r) devCap(s);
      }
      if (s.cap && devActive){                              /* 被吞的漂浮粒子：绕球心旋转 */
        s.ca += s.cs*dt*0.03;
        var sorb = dev.r*0.82*Math.sqrt(Math.max(0.1, s.cd));
        s.x = mx + Math.cos(s.ca)*sorb; s.y = my + Math.sin(s.ca)*sorb;
        s.vx = 0; s.vy = 0;
      } else {
        if (s.cap) s.cap = false;
        if (warpOn){                                        /* 穿梭：沿用原星尘，由小圆圈向外缓缓推进，外圈重生 */
          var osp = (0.55 + s.r*0.5) * dt;
          s.x += (wdx/wr)*osp; s.y += (wdy/wr)*osp;
          if (wr > warpR){
            var wa = Math.random()*6.2832, wrr = 26 + Math.random()*26;   /* 沿小圆圈重生，避免中心聚成一点 */
            s.x = wcx + Math.cos(wa)*wrr; s.y = wcy + Math.sin(wa)*wrr;
          }
        } else {
          s.vx += (s.bvx-s.vx)*0.035; s.vy += (s.bvy-s.vy)*0.035;
          s.x += s.vx*stick*dt; s.y += s.vy*stick*dt;
          if (s.x<-20) s.x=W+20; else if (s.x>W+20) s.x=-20;
          if (s.y<-20) s.y=H+20; else if (s.y>H+20) s.y=-20;
        }
      }
      var tw = 0.5+0.5*Math.sin(time*s.tsv+s.tw);
      var alpha = s.a*(0.35+0.65*tw);
      var d = (s.big ? s.r*7 : s.r*4)*(0.85+0.25*tw);
      if (warpOn){ var wrf = Math.min(1, wr/(warpR*0.5)); alpha *= Math.min(1, wr/72); d *= 0.4+0.8*wrf; }   /* 中心淡出，避免亮点 */
      var sHex, sMul = 1;
      if (normHex(cfg.floatColor)){ sHex = cfg.floatColor; sMul = hexAlpha(cfg.floatColor); }   /* 设了星光色即单独用，为空则跟随 */
      else if (cfg.colorful) sHex = (cfg.sourceType === 'image') ? imgStarHex(s) : starHex(s, time);   /* 原彩：文字按「星尘效果」取色，图片取图片颜色 */
      else { sHex = cfg.particleColor; sMul = hexAlpha(cfg.particleColor); }                     /* 非原彩：跟随星尘色 */
      ctx.globalAlpha = alpha * sMul;
      ctx.drawImage(spriteFor(bgStyle, sHex), s.x+bgX-d, s.y+bgY-d, d*2, d*2);
    }

    if (cfg.idle === 'river') drawRiver(dt, time);

    if (cfg.idle === 'flow'){
      ctx.lineCap = 'round';
      for (var fi=0; fi<flows.length; fi++){
        var f = flows[fi];
        if (f.done) continue;
        f.t += f.sp*0.02*dt;
        if (f.t >= 1){ if (cfg.loop) respawnFlow(f,false); else f.done = true; }
        var p1 = flowPt(f, f.t), p0 = flowPt(f, f.t-0.08);
        var vis = Math.sin(Math.PI*Math.max(0,Math.min(1,f.t)));
        ctx.globalAlpha = f.a*vis;
        ctx.strokeStyle = cfg.particleColor;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
      }
    }

    if (mActive && cfg.hover === 'devour'){
      var dvr = dev.r;
      ctx.globalAlpha = 0.5;
      ctx.drawImage(spriteFor('glow', cfg.colorful ? '#ffffff' : cfg.particleColor), mx-dvr, my-dvr, dvr*2, dvr*2);
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(mx, my, dvr, 0, 6.2832); ctx.stroke();
    } else if (mActive){
      var ar = PUSH_R*1.5; ctx.globalAlpha = 0.05;
      ctx.drawImage(spriteFor('glow', cfg.particleColor), mx-ar, my-ar, ar*2, ar*2);
    }

    /* 拖尾：沿鼠标移动轨迹绘制逐渐淡出的光点 */
    if (mActive && cfg.hover === 'trail' && TRAIL.length){
      var tnow = performance.now(), tcut = tnow - TRAIL_MS;
      while (TRAIL.length && TRAIL[0].t < tcut) TRAIL.shift();
      for (var tq=0; tq<TRAIL.length; tq++){
        var tp = TRAIL[tq], tage = (tnow - tp.t)/TRAIL_MS;
        var tr = (11*(1-tage) + 2) * (cfg.size||1);
        ctx.globalAlpha = (1-tage)*(1-tage)*0.5;
        ctx.drawImage(spriteFor('glow', cfg.colorful ? (tp.c || cfg.particleColor) : cfg.particleColor), tp.x-tr, tp.y-tr, tr*2, tr*2);
      }
      ctx.globalAlpha = 1;
    }

    /* 光束：字体里每个星尘与鼠标之间连一根细线，线色与该粒子一致 */
    if (mActive && cfg.hover === 'beam'){
      ctx.lineWidth = 1;
      for (var bh=0; bh<particles.length; bh++){
        var bp = particles[bh];
        var bdx = bp.x-mx, bdy = bp.y-my, bd2 = bdx*bdx + bdy*bdy;
        if (bd2 > 90000) continue;
        var bhex = particleHex(bp, time);
        var brgb = hexToRgb(bhex);
        ctx.globalAlpha = 0.32 * (1 - Math.sqrt(bd2)/300);
        ctx.strokeStyle = 'rgb('+brgb[0]+','+brgb[1]+','+brgb[2]+')';
        ctx.beginPath(); ctx.moveTo(bp.x, bp.y); ctx.lineTo(mx, my); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    if (state === 'scatter' && now > scatterUntil) state = 'forming';
    if (state === 'fall'){
      fallState.t += dt*0.016;
      if (fallState.t > fallState.dur){ state = 'forming'; fallState = null; }   /* 弹跳结束→缓缓归位 */
    }
    var forming = (state === 'forming');
    var ampBase = (cfg.spread != null ? cfg.spread : 1);

    for (var j=0;j<particles.length;j++){
      var p = particles[j];
      if (state === 'scatter'){ p.vx *= 0.975; p.vy *= 0.975; }
      else if (state === 'fall'){
        if (p.fw > 0){ p.fw -= dt*0.016; p.vx *= 0.7; p.vy = 0; }   /* 错峰等待，暂不落 */
        else {
          if (!p.fq){ p.fq = true; p.fa = 0; }
          p.fa += dt*0.016;
          var vterm = 5.0 * p.fv;                           /* 终端速度：像尘埃匀速飘落，不会越落越快 */
          p.vy += (vterm - p.vy) * 0.05 * dt;               /* 缓慢逼近终端速度 → 起步轻盈、下落平稳 */
          p.vx += (Math.sin(p.fa*1.6 + p.ph) * p.fs - p.vx) * 0.06 * dt;   /* 轻微左右摇曳，似落雪/浮尘 */
          var floorY = H - 6;
          if (p.y >= floorY){ p.y = floorY; p.vy = 0; p.vx *= 0.85; }      /* 轻柔落地，不弹跳 */
        }
      }
      else {
        var amp = (forming ? 0.5 : 0.85) * ampBase * 3;
        var jit = ampBase * 6;
        var sq  = Math.sin(time*p.sp + p.ph);
        var sq2 = Math.sin(time*p.sp*2.3 + p.ph*1.7);
        var tx = p.tx + (p.rx||0)*jit + (sq*0.68 + sq2*0.32) * amp;
        var ty = p.ty + (p.ry||0)*jit + (Math.cos(time*p.sp*1.13 + p.ph) + sq2*0.3) * amp * 0.9;
        var e = forming ? EASE_MOVE : EASE_HOLD;
        p.vx += ((tx-p.x)*e - p.vx) * VCHASE;
        p.vy += ((ty-p.y)*e - p.vy) * VCHASE;
      }
      if (devActive){
        var pbx = p.x-mx, pby = p.y-my, pb2 = pbx*pbx+pby*pby;
        if (!p.cap && pb2 < dev.r*dev.r) devCap(p);
      }
      if (p.cap && devActive){                              /* 被吞的星尘：绕球心旋转 */
        p.ca += p.cs*dt*0.03;
        var porb = dev.r*0.82*Math.sqrt(Math.max(0.1, p.cd));
        p.x = mx + Math.cos(p.ca)*porb; p.y = my + Math.sin(p.ca)*porb;
        p.vx = 0; p.vy = 0;
      } else {
        if (p.cap) p.cap = false;
        if (mActive && cfg.hover !== 'none' && cfg.hover !== 'trail' && cfg.hover !== 'beam' && cfg.hover !== 'devour' && cfg.hover !== 'parallax'){
          var dxm = p.x-mx, dym = p.y-my, dm2 = dxm*dxm + dym*dym;
          if (dm2 < PUSH_R*PUSH_R){
            var dm = Math.sqrt(dm2)||0.0001, dir2 = (cfg.hover==='attract'?-1:1);
            var pf = (1-dm/PUSH_R)*PUSH_P*dir2;
            p.vx += (dxm/dm)*pf; p.vy += (dym/dm)*pf;
          }
        }
        p.x += p.vx*dt; p.y += p.vy*dt;
      }
      var breath = 0.9 + 0.1*Math.sin(time*1.4 + p.br);
      var r = p.baseR * (cfg.size||1) * breath;
      var hex = particleHex(p, time);
      if (state === 'fall'){                              /* 坠落尾迹：极淡、很短的渐隐光痕，只作点缀 */
        var fsp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
        if (fsp > 1.0){
          var ftl = Math.min(26, fsp*2.8);
          var fnx = p.vx/fsp, fny = p.vy/fsp;
          var frgb = hexToRgb(hex);
          ctx.globalAlpha = Math.min(0.12, p.a*0.26);
          ctx.strokeStyle = 'rgba('+frgb[0]+','+frgb[1]+','+frgb[2]+',1)';
          ctx.lineWidth = Math.max(0.5, r*0.45);
          ctx.beginPath();
          ctx.moveTo(p.x - fnx*r*0.4, p.y - fny*r*0.4);
          ctx.lineTo(p.x - fnx*ftl, p.y - fny*ftl);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = p.a * (cfg.colorful ? 1 : hexAlpha(cfg.particleColor));
      ctx.drawImage(spriteFor(cfg.matter, hex), p.x+fgX-r, p.y+fgY-r, r*2, r*2);
    }

    /* 自动播放：按设定间隔自动触发一次点击效果（触发位置：中心 / 随机） */
    if (cfg.loop && cfg.click && cfg.click !== 'none'){
      autoAcc += dt * 0.016;
      var every = (cfg.autoSec > 0 ? cfg.autoSec : 7);
      if (autoAcc >= every){
        autoAcc = 0;
        if (cfg.autoPos === 'center') fireClick(W/2, H/2);
        else fireClick(W*(0.22+Math.random()*0.56), H*(0.22+Math.random()*0.56));
      }
    } else { autoAcc = 0; }

    /* 冲击波：爆炸时向外扩散的光环（仅用 globalAlpha 控制淡出，避免双重衰减） */
    if (shock){
      var sVel = shock.vel || 14, sDec = shock.dec || 0.92, sW = shock.w || 2, sN = shock.n || 1, sGap = shock.gap || 16;
      shock.r += sVel*dt; shock.a *= Math.pow(sDec, dt);
      if (shock.a < 0.02){ shock = null; }
      else {
        for (var si=0; si<sN; si++){
          var srr = shock.r - si*sGap;
          if (srr <= 0) continue;
          ctx.globalAlpha = shock.a * (1 - si*0.28);
          ctx.beginPath(); ctx.arc(shock.x, shock.y, srr, 0, 6.2832);
          ctx.lineWidth = sW; ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.stroke();
        }
      }
    }
    /* 海浪：向外扩散的波浪浪脊 */
    if (waves.length){
      for (var wj=waves.length-1; wj>=0; wj--){
        var wv = waves[wj];
        wv.r += wv.vel*dt; wv.a *= Math.pow(wv.dec, dt);
        if (wv.a < 0.02){ waves.splice(wj,1); continue; }
        ctx.globalAlpha = wv.a;
        ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,255,255,1)';
        var wa0 = wv.rot, wa1 = wv.rot + wv.arc;
        ctx.beginPath();
        for (var ws=0; ws<=44; ws++){
          var wth = wa0 + (wa1-wa0)*ws/44;
          var wrr = wv.r + 7*Math.sin(wth*6 + wv.ph);
          var wxx = wv.x + Math.cos(wth)*wrr, wyy = wv.y + Math.sin(wth)*wrr;
          if (ws===0) ctx.moveTo(wxx,wyy); else ctx.lineTo(wxx,wyy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    /* 漩涡：旋转弧线 */
    if (swirl){
      swirl.t += dt*0.14; swirl.a *= Math.pow(0.945, dt);
      if (swirl.a < 0.02){ swirl = null; }
      else {
        for (var wi=0; wi<3; wi++){
          var wr = 16 + swirl.t*46 + wi*17;
          var wa = swirl.t*2.2 + wi*2.1;
          ctx.globalAlpha = swirl.a * (1 - wi*0.24);
          ctx.beginPath(); ctx.arc(swirl.x, swirl.y, wr, wa, wa+1.7);
          ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;

    if (state === 'forming'){
      var far = 0, cnt = 0;
      for (var q=0;q<particles.length;q+=7){
        var pp = particles[q]; cnt++;
        if (Math.abs(pp.x-pp.tx)+Math.abs(pp.y-pp.ty) > 26) far++;
      }
      if (cnt && far < cnt*0.05) state = 'formed';
    }

    drawCursorFx(time);
    requestAnimationFrame(frame);
  }

  function fireText(){ cfg.text = (input.value.trim() || '〇'); cfg.sourceType='text'; rebuild(); updateSrcUI(); }
  input.addEventListener('keydown', function(e){ if (e.key==='Enter'){ e.stopPropagation(); if (cfg.sourceType==='image') rebuild(); else fireText(); input.blur(); } });
  input.addEventListener('pointerdown', function(e){ e.stopPropagation(); });

  var yearEl = document.getElementById('yearChip');
  var CUR_YEAR = String(new Date().getFullYear());
  if (yearEl){ yearEl.textContent = CUR_YEAR; yearEl.setAttribute('data-t', CUR_YEAR); }
  var copyYearEl = document.getElementById('copyYear');
  if (copyYearEl) copyYearEl.textContent = CUR_YEAR;
  var chips = document.querySelectorAll('.chip');
  for (var ci=0;ci<chips.length;ci++){ (function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var v = el.getAttribute('data-t'); if (v==null) return;
      input.value = v; fireText();
    });
  })(chips[ci]); }

  function updateImageRows(){
    var show = (cfg.sourceType === 'image');
    ['rowImgBright','rowImgContrast','rowImgSat'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.style.display = show ? 'flex' : 'none';
    });
  }
  function updateFloatPreview(){
    var ci = document.getElementById('cFloat'); if (!ci) return;
    var following = !normHex(cfg.floatColor);                 /* 星光色为空即「跟随」 */
    ci.classList.toggle('rainbow', !!(following && cfg.colorful && cfg.sourceType !== 'image'));
    if (!following){ ci.value = normHex(cfg.floatColor).slice(0,7); return; }
    if (cfg.colorful && cfg.sourceType === 'image') ci.value = imgRandHex().slice(0,7);   /* 图片：取图片颜色随机 */
    else if (cfg.colorful) ci.value = '#ffffff';              /* 文字：彩色，由 .rainbow 叠加彩虹预览 */
    else ci.value = normHex(cfg.particleColor) ? normHex(cfg.particleColor).slice(0,7) : '#ffffff';
  }
  function updateSrcUI(){
    var uc = document.getElementById('uploadChip');
    if (uc) uc.classList.toggle('active', cfg.sourceType === 'image');
    updateImageRows();
    updateFloatPreview();
  }
  document.getElementById('uploadChip').addEventListener('click', function(e){
    e.stopPropagation(); document.getElementById('fileImg').click();
  });
  function loadImageFile(f){
    if (!f) return;
    var isImg = (f.type && f.type.indexOf('image') === 0) || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(f.name || '');
    if (!isImg) return;
    cfg.imageName = f.name || '';
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        SRC.imageEl = img; SRC.fromUrl = false;
        cfg.imageData = downscale(img, 820);
        cfg.sourceType = 'image'; cfg.colorful = true;
        syncControls(); updateSrcUI(); rebuild();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  }
  document.getElementById('fileImg').addEventListener('change', function(ev){
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    loadImageFile(f);
  });
  input.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; input.classList.add('drop'); });
  input.addEventListener('dragenter', function(e){ e.preventDefault(); e.stopPropagation(); input.classList.add('drop'); });
  input.addEventListener('dragleave', function(e){ e.preventDefault(); e.stopPropagation(); input.classList.remove('drop'); });
  input.addEventListener('drop', function(e){
    e.preventDefault(); e.stopPropagation(); input.classList.remove('drop');
    var dt = e.dataTransfer; if (!dt) return;
    loadImageFile(dt.files && dt.files[0]);
  });
  ['dragover','drop'].forEach(function(t){
    document.addEventListener(t, function(e){ if (e.target !== input) e.preventDefault(); });
  });
  function downscale(img, max){
    var sc = Math.min(1, max/Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width*sc));
    c.height = Math.max(1, Math.round(img.height*sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { return c.toDataURL('image/png'); } catch(e){ return null; }
  }

  function inBlockedUI(t){
    return !!(t && t.closest && (t.closest('.ui') || t.closest('.chips') ||
      t.closest('.controls') || t.closest('.modal') || t.closest('.sel-list') || t.closest('.srcbar')));
  }
  /* 任一弹窗（设置 / 导出）打开时，鼠标移动、点击等一律不穿透到画布 */
  function modalOpen(){ return !!document.querySelector('.modal.open'); }
  var TRAIL = [], TRAIL_MS = 520;
  function trailHex(x, y){
    if (!cfg.colorful) return cfg.particleColor;
    if (cfg.sourceType === 'image') return imgRandHex();
    return starHex({ x:x, y:y, rc:0.5 }, performance.now()*0.001);   /* 原彩：与「星尘效果」同色，随位置 / 时间取色 */
  }
  function pushTrail(x, y){
    if (cfg.hover !== 'trail') return;
    TRAIL.push({ x:x, y:y, t:performance.now(), c:trailHex(x, y) });
    if (TRAIL.length > 160) TRAIL.shift();
  }
  window.addEventListener('pointermove', function(e){
    if (modalOpen()) return;
    if (document.body.classList.contains('export-locked')) return;
    mx = e.clientX; my = e.clientY; mActive = true;
    pushTrail(mx, my);
  }, { passive:true });
  window.addEventListener('pointerdown', function(e){
    if (modalOpen()) return;
    if (inBlockedUI(e.target)) return;
    if (document.body.classList.contains('export-locked')) return;
    mx = e.clientX; my = e.clientY; mActive = true;
    fireClick(e.clientX, e.clientY);
  });
  function clearTrail(){ mActive = false; TRAIL.length = 0; }
  document.addEventListener('mouseleave', clearTrail);
  window.addEventListener('blur', clearTrail);
  canvas.addEventListener('pointerleave', clearTrail);

  var rt = null;
  window.addEventListener('resize', function(){ if (rt) clearTimeout(rt); rt = setTimeout(resize, 180); });

        else { if (nextCode >= (1 << codeSize)) codeSize++; table[key] = nextCode++; }

    }
    emit(ib); emit(eoiCode);
    if (shift > 0) out.push(cur & 0xff);
    return out;

    put(gct);
    /* NETSCAPE2.0 循环扩展（无限循环） */
    put([0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00]);
    for (var f=0; f<frames.length; f++){
      put([0x21,0xF9,0x04,0x04]); put(u16(delayCs)); put([0x00,0x00]);                    /* 图形控制扩展 */
      put([0x2C]); put(u16(0)); put(u16(0)); put(u16(w)); put(u16(h)); put([0x00]);        /* 图像描述符 */
      put(gifSubBlocks(gifLzw(frames[f])));
    }
    put([0x3B]);                                          /* 结尾 */
    return new Uint8Array(b);
  }
  function exportGif(){
    openExp('视频预览');
    expPreview.innerHTML = '<span class="exp-hint">录制中…</span>';
    var maxW = 480, sc = Math.min(1, maxW/Math.max(W, H));
    var fw = Math.max(2, Math.round(W*sc)), fh = Math.max(2, Math.round(H*sc));
    var tmp = document.createElement('canvas'); tmp.width = fw; tmp.height = fh;
    var tctx = tmp.getContext('2d');
    var fps = 12, total = fps*4;                            /* 4 秒 @12fps */
    var frames = [], cap = 0;
    explode(W/2, H/2);
    var timer = setInterval(function(){
      try {
        tctx.drawImage(canvas, 0, 0, fw, fh);
        frames.push(gifQuantize(tctx.getImageData(0, 0, fw, fh).data));
      } catch(e){}
      cap++;
      if (cap === (total >> 1)) explode(W/2, H/2);
      if (cap >= total){
        clearInterval(timer);
        try {
          var gif = gifBuild(frames, fw, fh, Math.round(100/fps));
          var blob = new Blob([gif], { type:'image/gif' });
          var im = document.createElement('img'); im.alt = 'GIF'; im.src = URL.createObjectURL(blob); showExp(im);
          setDl(function(){ return blob; }, fileBase()+'.gif');
        } catch(e){ expPreview.innerHTML = '<span class="exp-hint">生成 GIF 失败</span>'; }
      }
    }, Math.round(1000/fps));
  }
  function exportCfg(wall){
    return { sourceType:cfg.sourceType, text:cfg.text,
      imageData: (cfg.sourceType==='image' ? cfg.imageData : null),
      colorful:cfg.colorful, starFx:cfg.starFx, fxDir:cfg.fxDir, theme:cfg.theme, particleColor:cfg.particleColor, bgColor:cfg.bgColor, floatColor:cfg.floatColor,
      imgBright:cfg.imgBright, imgContrast:cfg.imgContrast, imgSat:cfg.imgSat,
      matter:cfg.matter, texture:cfg.texture, density:cfg.density, spread:cfg.spread, size:cfg.size,
      cursor:cfg.cursor, cursorFx:cfg.cursorFx, hideCursor:cfg.hideCursor, hover:cfg.hover, click:cfg.click, idle:cfg.idle, loop:cfg.loop,
      autoPos:cfg.autoPos, autoSec:cfg.autoSec,
      exportMode:true, wallpaper:!!wall };
  }
  var expBtns = document.querySelectorAll('.exp-go');
  for (var ei=0;ei<expBtns.length;ei++){ (function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var t = b.getAttribute('data-exp');
      if (t==='image') exportImage();
      else if (t==='video') exportVideo();
    });
  })(expBtns[ei]); }

  /* 把当前全部配置写进网址参数，打开链接即还原该样式 */
  function encodeImageForUrl(el){
    if (!el) return null;
    try {
      var max = 256, sc = Math.min(1, max/Math.max(el.width, el.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(el.width*sc));
      c.height = Math.max(1, Math.round(el.height*sc));
      var cx = c.getContext('2d');
      cx.drawImage(el, 0, 0, c.width, c.height);
      /* 优先 WebP 有损：同等观感体积远小于 JPEG/PNG，且支持透明（透明图不必再走超长 PNG），显著缩短分享链接 */
      try {
        var webp = c.toDataURL('image/webp', 0.82);
        if (webp && webp.indexOf('data:image/webp') === 0) return webp;
      } catch(e){}
      /* 回退老浏览器：有透明像素用 PNG 保真（JPEG 无透明通道，会把透明压成黑底并产生色偏），否则 JPEG */
      var hasAlpha = false;
      try {
        var d = cx.getImageData(0, 0, c.width, c.height).data;
        for (var ai=3; ai<d.length; ai+=4){ if (d[ai] < 250){ hasAlpha = true; break; } }
      } catch(e){}
      return hasAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
    } catch(e){ return null; }
  }
  function buildShareUrl(){
    var base;
    try {
      base = (window.location.origin && window.location.origin !== 'null')
        ? (window.location.origin + window.location.pathname) : 'http://cosmos.gaucn.com/';
    } catch(e){ base = 'http://cosmos.gaucn.com/'; }
    var p = new URLSearchParams();
    if (cfg.sourceType === 'image' && cfg.imageData){
      p.set('source', 'image');
      p.set('image', (SRC.fromUrl && cfg.imageData) ? cfg.imageData : (encodeImageForUrl(SRC.imageEl) || cfg.imageData));
    } else {
      p.set('source', 'text');
      p.set('text', cfg.text || '〇');
    }
    p.set('colorful', cfg.colorful ? '1' : '0');
    if (cfg.colorful && cfg.sourceType !== 'image') p.set('starfx', cfg.starFx || 'rainbow');
    p.set('theme', cfg.theme || 'white');
    p.set('pcolor', normHex(cfg.particleColor) || '#FFFFFF');
    p.set('bgcolor', normHex(cfg.bgColor) || '#000000');
    if (normHex(cfg.floatColor)) p.set('fcolor', normHex(cfg.floatColor));
    if (cfg.sourceType === 'image'){
      if (cfg.imgBright) p.set('imgbright', cfg.imgBright);
      if (cfg.imgContrast) p.set('imgcontrast', cfg.imgContrast);
      if (cfg.imgSat) p.set('imgsat', cfg.imgSat);
    }
    p.set('matter', cfg.matter);
    p.set('texture', cfg.texture);
    p.set('density', cfg.density);
    p.set('spread', Math.round((cfg.spread || 1)*100));
    p.set('size', Math.round((cfg.size || 1)*100));
    p.set('hover', cfg.hover);
    p.set('click', cfg.click);
    p.set('idle', cfg.idle);
    p.set('loop', cfg.loop ? '1' : '0');
    p.set('pos', cfg.autoPos);
    p.set('sec', cfg.autoSec);
    p.set('hidecursor', cfg.hideCursor ? '1' : '0');
    if (cfg.cursorFx && cfg.cursorFx !== 'none') p.set('cursorfx', cfg.cursorFx);
    if (cfg.colorful && cfg.sourceType !== 'image' && cfg.starFx === 'flow') p.set('fxdir', cfg.fxDir || 'h');
    if (cfg.ui === 'read') p.set('ui', 'read');
    return base + '?' + p.toString();
  }

  /* 分享：复制当前样式的链接到剪贴板（图标短暂变为对勾反馈） */
  (function(){
    var btn = document.getElementById('shareCopy');
    var field = document.getElementById('shareUrl');
    if (!btn || !field) return;
    var ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    var ICON_OK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
    var resetTimer = null;
    function done(){
      btn.innerHTML = ICON_OK; btn.classList.add('done');
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){ btn.innerHTML = ICON_COPY; btn.classList.remove('done'); }, 1400);
    }
    function legacy(){
      try{
        field.removeAttribute('readonly'); field.select(); field.setSelectionRange(0, field.value.length);
        document.execCommand('copy'); field.setAttribute('readonly','readonly'); done();
      }catch(err){ field.setAttribute('readonly','readonly'); }
    }
    function refreshShare(){ field.value = buildShareUrl(); }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var url = buildShareUrl(); field.value = url;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done, legacy);
      } else legacy();
    });
    refreshShare();
    var modalEl = document.getElementById('modal');
    if (modalEl){
      var rTimer = null;
      var onChange = function(){ if (rTimer) clearTimeout(rTimer); rTimer = setTimeout(refreshShare, 150); };
      modalEl.addEventListener('input', onChange);
      modalEl.addEventListener('change', onChange);
    }
  })();

  if (cfg.sourceType === 'image' && cfg.imageData){
    var im = new Image();
    /* 图片源可以是 data URI，也可以是图片 URL；跨域 URL 需带 crossOrigin 才能被 Canvas 取色（同源 / data URI 不受影响） */
    if (cfg.imageData.indexOf('data:') !== 0) im.crossOrigin = 'anonymous';
    im.onload = function(){ SRC.imageEl = im; SRC.fromUrl = true; rebuild(); };
    im.onerror = function(){ /* 跨域图未开 CORS 时加载失败：保持原状态，控制台会报错提示 */ };
    im.src = cfg.imageData;
  }
  if (cfg.exportMode){
    setTimeout(function(){ var h = document.querySelector('.hint'); if (h) h.style.display='none'; }, 4200);
  }
  enhanceSelects();
  syncControls();
  syncEye();
  updateSrcUI();
  resize();
  requestAnimationFrame(frame);

  /* —— JS 传参：供 iframe 父页面用 postMessage 传参，或控制台直接调用 ——
     键名与取值同 URL 参数（见 README）；也兼容 sourceType / imageData / particleColor 等驼峰写法。
     例：iframe.contentWindow.postMessage({ text:'MOTED', theme:'cyan', colorful:true }, 'https://cosmos.gaucn.com');
     加载后也可直接调用 window.MOTE.apply({...}) 局部更新。 */
  var KALIAS = { sourcetype:'source', imagedata:'image', particlecolor:'pcolor', bgcolor:'bgcolor',
    floatcolor:'fcolor', starfx:'starfx', fxdir:'fxdir', cursorfx:'cursorfx', hidecursor:'hidecursor',
    imgbright:'imgbright', imgcontrast:'imgcontrast', imgsat:'imgsat', autopos:'pos', autosec:'sec' };
  function paramsFromObject(o){
    var p = new URLSearchParams();
    for (var k in o){
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      var v = o[k]; if (v == null) continue;
      var name = KALIAS[String(k).toLowerCase()] || String(k).toLowerCase();
      if (typeof v === 'boolean'){ p.set(name, v ? '1' : '0'); continue; }
      /* spread / size 兼容对象语义（1.0 = 100%）：数值 ≤ 5 视为比例，自动换算成百分比 */
      if ((name === 'spread' || name === 'size') && typeof v === 'number' && Math.abs(v) <= 5){ p.set(name, String(v*100)); continue; }
      p.set(name, String(v));
    }
    return p;
  }
  function applyRuntime(o){
    if (!o || typeof o !== 'object') return false;
    if (!applyParams(paramsFromObject(o))) return false;
    document.body.classList.toggle('ui-read', cfg.ui === 'read');   /* 运行时也能切换只读 / 编辑界面，与 URL 传参一致 */
    if (cfg.sourceType === 'image' && cfg.imageData){
      var ri = new Image();
      if (cfg.imageData.indexOf('data:') !== 0) ri.crossOrigin = 'anonymous';   /* 跨域 URL 图片需 CORS 才能取色；同源 / data URI 不受影响 */
      ri.onload = function(){ SRC.imageEl = ri; SRC.fromUrl = true; syncControls(); updateSrcUI(); rebuild(); };
      ri.onerror = function(){ syncControls(); updateSrcUI(); };
      ri.src = cfg.imageData;
    } else {
      syncControls(); updateSrcUI(); rebuild();
    }
    return true;
  }
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (typeof d === 'string'){ try { d = JSON.parse(d); } catch(e){ return; } }
    applyRuntime(d);
  });
  window.MOTE = { apply: applyRuntime };
})();
</script>
